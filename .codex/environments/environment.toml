# Codex environment for this repo. Adapted from image-trail's; maintained BY HAND here —
# edit freely and keep it in review like any other tooling config.
version = 1
name = "photos"

[setup]
script = '''
bash .codex/scripts/setup.sh
'''

[setup.win32]
script = '''
$gitExe = (Get-Command git -ErrorAction Stop).Source
$gitRoot = Split-Path -Parent (Split-Path -Parent $gitExe)
$bash = Join-Path $gitRoot 'bin\bash.exe'

if (-not (Test-Path -LiteralPath $bash)) {
  throw "Git Bash was not found at $bash"
}

& $bash --noprofile --norc -c 'export PATH="/usr/bin:/bin:$PATH"; exec bash .codex/scripts/setup.sh'
exit $LASTEXITCODE
'''

[cleanup]
script = '''
bash .codex/scripts/cleanup.sh
'''

[cleanup.win32]
script = '''
$gitExe = (Get-Command git -ErrorAction Stop).Source
$gitRoot = Split-Path -Parent (Split-Path -Parent $gitExe)
$bash = Join-Path $gitRoot 'bin\bash.exe'

if (-not (Test-Path -LiteralPath $bash)) {
  throw "Git Bash was not found at $bash"
}

& $bash --noprofile --norc -c 'export PATH="/usr/bin:/bin:$PATH"; exec bash .codex/scripts/cleanup.sh'
exit $LASTEXITCODE
'''
