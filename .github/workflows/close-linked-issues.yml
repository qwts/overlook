name: Close linked issues

# pull_request_target, not pull_request: fork-PR pull_request runs get a read-only
# GITHUB_TOKEN regardless of the permissions block, so gh issue close would fail.
# Safe here: the default checkout is the trusted BASE ref (main), so the script that
# runs is main's copy — PR head code is never executed; the PR body is only parsed.
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@c7d95401590a7d38bc90f5b51df66edcc4104528
        with:
          authorization-only: 'true'

  close-linked-issues:
    needs: policy
    name: Close linked issues
    # Keep in sync with TARGET_BASE_REFS in scripts/close-linked-issues.mjs.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Close issues referenced by merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/close-linked-issues.mjs
