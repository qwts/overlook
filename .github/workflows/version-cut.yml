# Version-cut automation (#171): consumes accumulated changesets into releases.
#
# Two halves, both driven by pushes to main:
#  1. version-pr — while changesets are pending, keep a "Version packages" PR
#     open and current (`changeset version`, then a force-push of
#     changeset-release/main, on every main push). Merging that PR is the human
#     "cut a release" act.
#  2. tag — after the version PR merges (no changesets pending, version in
#     package.json untagged), tag v<version> and hand off to the release
#     workflow.
#
# Both halves authenticate as chores-dumb[bot], a GitHub App whose installation
# token is minted per run from the repository's App client ID and private key.
# There is no PAT or GITHUB_TOKEN write fallback. Two reasons for the App:
#  - GITHUB_TOKEN events cannot trigger other workflows. A bot-refreshed version
#    PR got no pull_request CI runs even though main requires the "CI" and
#    "E2E gate" checks, and a GITHUB_TOKEN tag push fired no on:push:tags run.
#    Both downstream runs had to be dispatched explicitly.
#  - Governed automation authorizes initiators explicitly, and
#    github-actions[bot] is not one of them. A later workflow that needs write
#    authority must be initiated as chores-dumb[bot], not by a repository token.
# Under the App the actor is an authorized non-human account and both events
# fire on their own: the version PR gets real pull_request runs, and the tag push
# starts release.yml directly. It also un-deadlocks review — a PAT opens the
# version PR as qwts, who cannot approve their own PR (ENG-0045 decision 4), so
# every cut needed a bypass. chores-dumb[bot] opens it, and a human approves.
# No dispatch steps, no `actions: write` on the version job. Repository tokens
# reach only actions/* steps and first-party command steps that need them;
# third-party tooling runs without credentials.
# Missing or unreadable App credentials fail closed before any repository write.
name: Version cut

on:
  push:
    branches:
      - main
  # Manual refresh / recovery (e.g. re-tag after a partial failure).
  workflow_dispatch:

# Serialize whole-workflow runs: back-to-back merges otherwise race the
# version-branch force-push and the tag/rev-parse check.
concurrency:
  group: version-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@edc54f94b2afdb4ef48e1f5716aef0192942cb11
        with:
          authorization-only: 'true'

  version-pr:
    needs: policy
    name: Version packages PR
    runs-on: ubuntu-latest
    env:
      HAS_CHORES_DUMB: ${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}
    steps:
      - name: Require chores-dumb credentials
        run: test "$HAS_CHORES_DUMB" = true

      - name: Mint the chores-dumb token
        id: chores
        # actions/* — first-party, so the App key never reaches a third-party
        # action (AGENTS.md → Branch And GitHub Hygiene).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The versioning CLI must not inherit a persisted repository token.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The changeset CLI is plain JS — skip postinstall (Electron binary
      # download + native rebuild) that versioning never needs.
      - name: Install dependencies (scripts skipped)
        run: npm ci --ignore-scripts

      # Done in-repo rather than by changesets/action. `changeset version` runs
      # without repository credentials; only the first-party push/PR step below
      # receives a token.
      - name: Create the Version packages commit
        id: version
        env:
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No changesets pending — nothing to version."
            exit 0
          fi
          npx changeset version
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo '::warning::Changesets are pending but "changeset version" changed nothing.'
            exit 0
          fi
          git commit -m 'Version packages'
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Push and refresh the Version packages PR
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # The branch is a disposable projection of main + the pending
          # changesets, rebuilt from the current tip on every main push — force
          # is the point. The branch updater excludes changeset-release branches.
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push --force origin "$BRANCH"
          {
            echo "Merging this PR cuts \`v$version\`: the tag and the release build follow automatically."
            echo
            echo "Do not hand-edit — every push to main rebuilds this branch from the pending changesets."
            echo
            echo '## Changelog'
            echo
            awk -v ver="$version" '
              $0 ~ "^## " ver "$" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/pr-body.md"
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # The rolling PR outlives the changesets it was opened for. Its body
            # is regenerated on every refresh, not just at creation — otherwise it
            # keeps advertising the version and changelog from whenever it was
            # first opened while the branch underneath moves on
            # (qwts/image-trail#704 review).
            gh pr edit "$open" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Version PR #$open refreshed for v$version."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --title 'Version packages' \
            --body-file "$RUNNER_TEMP/pr-body.md"

  tag:
    needs: policy
    name: Tag version merges
    runs-on: ubuntu-latest
    env:
      HAS_CHORES_DUMB: ${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}
    steps:
      - name: Require chores-dumb credentials
        run: test "$HAS_CHORES_DUMB" = true

      - name: Mint the chores-dumb token
        id: chores
        # actions/* — first-party, so the App key never reaches a third-party
        # action (AGENTS.md → Branch And GitHub Hygiene).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags + history for the already-tagged check.
          fetch-depth: 0
          # The tag push has to start release.yml under the authorized App.
          token: ${{ steps.chores.outputs.token }}

      - name: Tag when the current version is a fresh cut
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push events only tag when this push actually changed the version —
          # otherwise the first changeset-free push after this workflow lands
          # would tag the never-cut 0.1.0 at an arbitrary commit. Manual
          # dispatch skips the comparison (recovery for a cut whose tagging
          # failed) but still requires no-pending-changesets + untagged below.
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git show 'HEAD~1:package.json' 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo '')
            cur=$(node -p 'require("./package.json").version')
            if [ "$prev" = "$cur" ]; then
              echo "Version unchanged ($cur) — not a version-cut merge."
              exit 0
            fi
          fi
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            echo "Changesets pending — nothing to tag."
            exit 0
          fi
          version="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already tagged."
            # Recovery path (PR #178 review): a tag whose release run failed —
            # or that predated release.yml — would otherwise be stranded, and no
            # push event can be replayed for a tag that already exists.
            # Dispatch from main (which contains release.yml — a stranded tag
            # by definition does not; PR #181 review), tag passed as input.
            # Needs the App/PAT identity: github-actions[bot] is not an
            # authorized initiator for governed release recovery.
            if ! gh release view "$version" >/dev/null 2>&1; then
              echo "$version has no release — dispatching."
              gh workflow run release.yml --ref main -f tag="$version" \
                || echo "::notice::release.yml not dispatchable — $version still has no release."
            fi
            exit 0
          fi
          # The tag must never outrun the main-push CI run for this exact SHA.
          # Wait for its stable gate instead of dispatching an equivalent suite.
          ci_run=''
          for _ in $(seq 1 140); do
            ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$GITHUB_SHA&per_page=100" \
              --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml") | .id) // empty')
            if [ -n "$ci_run" ]; then
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" --jq '.conclusion // empty')
              if [ "$conclusion" = success ]; then break; fi
              if [ -n "$conclusion" ]; then
                echo "::error::Exact-commit CI concluded $conclusion; refusing to tag."
                exit 1
              fi
            fi
            sleep 30
          done
          test -n "$ci_run"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')" = true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "Release $version"
          git push origin "$version"
          echo "Tagged $version."
          # No dispatch: pushed under the App, this tag fires release.yml's
          # on:push:tags trigger directly.
