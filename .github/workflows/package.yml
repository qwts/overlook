# Packaging on demand (#53, #128). Deliberately NOT part of the PR
# gate — packaging is the slow lane; run it manually when packaging risk
# changes (Electron bumps, native modules, builder config). The Release
# workflow reuses this matrix via workflow_call so it lives in one place.
#
# Signing is env-gated (#128, #683): when the CSC_LINK secret exists, the mac leg
# signs (Developer ID + hardened runtime) and notarizes (notarytool via the
# APPLE_API_* secrets); when AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET
# exist, the Windows legs sign via Azure Trusted Signing (individual-identity
# validation, no local certificate). Without secrets the builds are unsigned,
# as before.
#
# Windows ships two architectures (#683): the matrix runs the x64 and arm64
# legs on windows-latest (arm64 cross-compiled from the x64 runner), each
# producing an architecture-qualified NSIS installer whose payload architecture
# is verified post-build.
name: Package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Build a specific ref (the Release workflow pins builds to the tag even
      # when dispatched from main). Empty = the triggering ref, as before.
      ref:
        type: string
        required: false
        default: ''
    secrets:
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      PCLOUD_CLIENT_ID:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      MAC_PROVISIONING_PROFILE:
        required: false
      FILE_PROVIDER_PROVISIONING_PROFILE:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          authorization-only: 'true'

  package:
    needs: policy
    strategy:
      # The legs are independent — let one finish even if another fails.
      fail-fast: false
      matrix:
        # One macOS leg plus one Windows leg per architecture (#683). arm64 is
        # cross-compiled on the x64 windows-latest runner; verify-windows-arch
        # proves the payloads are genuinely arm64.
        include:
          - os: macos-latest
          - os: windows-latest
            win-arch: x64
          - os: windows-latest
            win-arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install locked packaging dependencies
          executable: ${{ runner.os == 'Windows' && 'npm.cmd' || 'npm' }}
          arguments-json: '["ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'

      # Build in a step whose env carries no signing secrets (#855): the
      # compound package* scripts used to run `npm run build` under the full
      # signing env, exposing certificate material to electron-vite and every
      # build-time dependency. The Package step below scopes the signing
      # secrets to the electron-builder invocation via the dist* scripts,
      # which package without rebuilding.
      - name: Build
        shell: bash
        env:
          # Public installed-app OAuth identifier embedded at build time.
          OVERLOOK_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          # Public pCloud OAuth identifier. Supplying it enables the provider;
          # an empty secret keeps unsigned/pre-release builds fail-closed.
          OVERLOOK_PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
          # Generated Desktop credential required by this issued client. Like
          # the client ID it is extractable installed-app metadata, but it is
          # kept out of source and injected only into the main-process bundle.
          OVERLOOK_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          # Public Chrome Web Store identity used for the exact native-host
          # allowed_origins entry. Empty pre-release builds fail closed.
          OVERLOOK_IMAGE_TRAIL_EXTENSION_ID: ${{ vars.IMAGE_TRAIL_EXTENSION_ID }}
          WIN_ARCH: ${{ matrix.win-arch }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_ARCH" ] && [ "$WIN_ARCH" != "x64" ]; then
            # sharp ships its native binary as per-arch @img/sharp-win32-<arch>
            # optional deps; the x64 runner installs only its host
            # (x64) one, so a cross-compiled arm64 build would bundle the x64
            # sharp binary (caught by verify-windows-arch). Fetch ONLY the
            # target-arch binary and swap it in. A target-flagged registry install of
            # sharp re-resolves the whole tree's optional deps for the target
            # and prunes the x64 build toolchain (@rollup/rollup-win32-x64-msvc,
            # swc, …) that must run natively on this x64 runner. npm pack +
            # extract touches nothing else. better-sqlite3 v13 bundles both
            # Windows Node-API prebuilds; afterPack keeps only $WIN_ARCH before
            # verify-windows-arch inspects every shipped .node (#683, #1020).
            sharp_ver=$(node -p "require('./node_modules/sharp/package.json').version")
            pkg="sharp-win32-$WIN_ARCH"
            tgz="img-$pkg-$sharp_ver.tgz"
            # Pack/extract with relative paths only: git-bash tar reads a
            # Windows $RUNNER_TEMP path (D:\...) as an rsync host:path spec and
            # fails with "Cannot connect to D:", so keep everything cwd-relative.
            npm pack "@img/$pkg@$sharp_ver" >/dev/null
            # npm pack trusts live registry metadata, so independently bind the
            # downloaded native binary to the artifact reviewed in the lockfile.
            node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              const [pkg, version, tgz] = process.argv.slice(1);
              const locked = require("./package-lock.json").packages[`node_modules/@img/${pkg}`];
              if (!locked || locked.version !== version || !locked.integrity?.startsWith("sha512-")) {
                throw new Error(`Missing exact sha512 lock entry for @img/${pkg}@${version}`);
              }
              const actual = `sha512-${createHash("sha512").update(readFileSync(tgz)).digest("base64")}`;
              if (actual !== locked.integrity) throw new Error(`Lockfile integrity mismatch for @img/${pkg}@${version}`);
            ' "$pkg" "$sharp_ver" "$tgz"
            dest="node_modules/@img/$pkg"
            rm -rf "$dest" && mkdir -p "$dest"
            tar -xzf "$tgz" -C "$dest" --strip-components=1
            rm -f "$tgz"
            # Drop the host-arch sharp binaries so only the target payload ships.
            find node_modules/@img -maxdepth 1 -type d -name 'sharp-win32-*' ! -name "$pkg" -exec rm -rf {} +
          fi
          npm run build

      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          MAC_PROVISIONING_PROFILE_B64: ${{ runner.os == 'macOS' && secrets.MAC_PROVISIONING_PROFILE || '' }}
          FILE_PROVIDER_PROVISIONING_PROFILE_B64: ${{ runner.os == 'macOS' && secrets.FILE_PROVIDER_PROVISIONING_PROFILE || '' }}
          APPLE_API_KEY_B64: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          # Azure Trusted Signing service principal (#683), kept separate from
          # the mac CSC_* secrets so a mac-only .p12 never reaches the Windows
          # signer.
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          WIN_ARCH: ${{ matrix.win-arch }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then
            # electron-builder's notarytool integration wants APPLE_API_KEY as
            # a path to the .p8; the secret holds its base64-encoded contents.
            # Without the notarize secrets electron-builder signs but skips
            # notarization — the spctl gate below then fails the leg, so a
            # signed-but-unnotarized artifact can never ship.
            if [ -n "$APPLE_API_KEY_B64" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/asc-api-key.p8"
              printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$APPLE_API_KEY"
            fi
            if [ -n "$MAC_PROVISIONING_PROFILE_B64" ]; then
              if [ -z "$FILE_PROVIDER_PROVISIONING_PROFILE_B64" ]; then
                echo "FILE_PROVIDER_PROVISIONING_PROFILE is required for provisioned macOS packages" >&2
                exit 1
              fi
              export OVERLOOK_MAC_PROVISIONING_PROFILE="$RUNNER_TEMP/overlook.provisionprofile"
              export OVERLOOK_FILE_PROVIDER_PROVISIONING_PROFILE="$RUNNER_TEMP/overlook-file-provider.provisionprofile"
              printf '%s' "$MAC_PROVISIONING_PROFILE_B64" | base64 -d > "$OVERLOOK_MAC_PROVISIONING_PROFILE"
              printf '%s' "$FILE_PROVIDER_PROVISIONING_PROFILE_B64" | base64 -d > "$OVERLOOK_FILE_PROVIDER_PROVISIONING_PROFILE"
              npm run dist:signed:provisioned
            else
              # A profile-free release remains launchable and signed, but its
              # Touch ID adapter fails closed to password/recovery fallback.
              npm run dist:signed
            fi
            # electron-builder only *warns* when it can't find an identity, so
            # a broken cert would silently ship unsigned. Fail loudly instead:
            # a valid signature and a Gatekeeper pass (notarization is checked
            # online) are hard requirements of the signed path (#128).
            app=$(find release -maxdepth 2 -name '*.app' | head -1)
            if [ -n "$MAC_PROVISIONING_PROFILE_B64" ]; then
              node scripts/verify-macos-provisioned-app.mjs "$app"
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            archive=$(find release -maxdepth 1 -name '*-mac.zip' | head -1)
            node scripts/verify-macos-app-launch.mjs "$archive"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # The mac CSC_* secrets must never reach the Windows signer (a
            # mac-only .p12 would fail Authenticode); Windows signing no
            # longer consults CSC_LINK at all now that it's Azure Trusted
            # Signing, but clear it anyway as cheap insurance.
            unset CSC_LINK CSC_KEY_PASSWORD
            # electron-builder compresses the NSIS payload with a downloaded
            # 7-Zip 24.x, which auto-applies its ARM64 branch filter (method
            # 0A) to ARM64 binaries — but the nsis7z plugin that unpacks that
            # payload at install time is far older and cannot decode it. It
            # fails per-file and keeps going, so the arm64 installer produced a
            # complete install MINUS every ARM64 binary: Overlook.exe plus 10
            # DLLs (ffmpeg, libEGL, libGLESv2, vulkan-1, libvips, …). The
            # install looked successful and then had no executable (#683).
            # Pin a filter old enough for nsis7z to decode; electron-builder
            # allows BCJ/BCJ2/ARM/ARMT/IA64/PPC/SPARC/DELTA (notably not
            # ARM64). Filters are reversible transforms — extracted bytes are
            # identical either way, this only costs ~8% compression ratio.
            # Set for both arches: 7-Zip already picks BCJ2 for x64 on its
            # own, so this just makes the choice explicit instead of implicit.
            export ELECTRON_BUILDER_7Z_FILTER=BCJ2
            # azureSignOptions is a hard requirement in electron-builder.yml —
            # unlike signtool's CSC_LINK, Azure Trusted Signing has no
            # opportunistic-cert fallback, so it errors out instead of
            # skipping when unconfigured. Force it off via CLI override when
            # the service-principal secrets are absent, so the build still
            # ships unsigned rather than failing outright.
            if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
              npm run "dist:win:$WIN_ARCH"
            else
              # dist:win:$WIN_ARCH is "electron-builder ... && npm run
              # licenses:sbom" -- `npm run x -- args` appends args to the
              # whole script, not just the electron-builder call inside it, so the
              # override has to be applied to a direct electron-builder invocation
              # instead of routed through that compound script.
              npx --no-install electron-builder --publish never --win --"$WIN_ARCH" \
                -c.win.azureSignOptions=null
              npm run licenses:sbom
            fi
            # Prove the cross-compiled payloads are genuinely the target arch:
            # the installed executable and every native .node, not the i386 NSIS
            # stub. Auto-locates the arch's unpacked dir (win-unpacked for x64,
            # win-arm64-unpacked for arm64). Fails on any host-arch leak (#683).
            node scripts/verify-windows-arch.mjs "$WIN_ARCH"
            if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
              # electron-builder only *warns* when signing is misconfigured, so
              # verify the Authenticode signature and timestamp explicitly — a
              # signed release must never ship unsigned installers (#683).
              # Get-AuthenticodeSignature over signtool.exe: the latter ships
              # with the Windows SDK but isn't on windows-latest's PATH, while
              # Get-AuthenticodeSignature is a builtin PowerShell cmdlet.
              for installer in release/Overlook-*-"$WIN_ARCH".exe; do
                pwsh -NoProfile -Command "
                  \$sig = Get-AuthenticodeSignature -FilePath '$installer'
                  Write-Host \"Status: \$(\$sig.Status) — \$(\$sig.StatusMessage)\"
                  if (\$sig.Status -ne 'Valid') { exit 1 }
                "
              done
            fi
          else
            # Unsigned mac path. The mac cert must not leak into it: with these
            # set, electron-builder would try to use CSC_LINK for Windows
            # signing too (and fail on a mac-only .p12).
            unset CSC_LINK CSC_KEY_PASSWORD
            npm run dist
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(find release -maxdepth 2 -name '*.app' | head -1)
            node scripts/verify-macos-heic-preview.mjs "$app" tests/fixtures/heic/iphone-13-pro.heic
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Architecture-qualified name on Windows so the x64 and arm64 legs
          # upload to distinct artifacts (#683); macOS keeps its os-named one.
          name: overlook-${{ matrix.win-arch != '' && format('windows-{0}', matrix.win-arch) || matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/sbom.cyclonedx.json
            THIRD-PARTY-NOTICES.md
          retention-days: 14
