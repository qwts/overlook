# Dev releases (#172): v* tag → packaged builds → GitHub prerelease.
#
# Normally dispatched by version-cut.yml from main with the tag as an input —
# GITHUB_TOKEN tag pushes fire no workflows, and dispatching by tag ref only
# works when the tag already contains this file (PR #181 review), which a
# stranded tag by definition does not. The on:push:tags trigger still covers
# tags pushed by humans. Builds check out the TAG's tree regardless of the
# dispatching ref, and reuse the Package matrix via workflow_call. Signing is
# reported on each downloadable installer; it never pollutes the release/tag
# title. Every build remains explicitly prerelease software (#735).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and release'
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@40d1c46756ba70ef40d1b56915d1cdd45b8efa85
        with:
          authorization-only: 'true'

  verify:
    needs: policy
    name: Verify release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and version provenance
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release runs only on v* tags (got $TAG)."; exit 1 ;;
          esac
          release_sha=$(git rev-list -n 1 "$TAG")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Verify exact-commit complete-suite and reviewed-PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Identify CI runs by `.path` ONLY. A workflow run's `.name` is its
          # evaluated `run-name:`, so ci.yml's dynamic run-name makes a
          # `.name == "CI"` match select nothing (see version-cut.yml). Job-level
          # `.name` checks below are JOB names, which `run-name` does not touch.
          queue_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$RELEASE_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          if [ -n "$queue_run" ]; then
            complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$queue_run/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          else
            push_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$RELEASE_SHA&per_page=100" \
              --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
            test -n "$push_run"
            complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$push_run/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "Complete suite" and .conclusion == "success")')
          fi
          test "$complete" = true

          pr=$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" |
            jq -r --arg sha "$RELEASE_SHA" 'first(.[] | select(.merge_commit_sha == $sha and .merged_at != null and .base.ref == "main")) | .number // empty')
          test -n "$pr"
          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews?per_page=100" \
            --jq 'any(.[]; .state == "APPROVED")')
          test "$approved" = true
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')
          pr_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$pr_head&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          test -n "$pr_run"
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pr_run/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          test "$verified" = true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install release verification dependencies (scripts skipped)
        uses: qwts/playbook-engineering/.github/actions/bounded-command@b146b85da189d188f71cda59d363eec7272e498e
        with:
          task: Install locked release verification dependencies
          executable: npm
          arguments-json: '["ci","--ignore-scripts"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Verify semantic changeset state
        run: |
          status_file="$RUNNER_TEMP/changeset-status.json"
          npx changeset status --output "$status_file"
          releases=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).releases.length' "$status_file")
          test "$releases" -eq 0

  build:
    name: Build packages
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    # Reusable-workflow credentials are an explicit reviewed interface (#993).
    # Absent signing secrets preserve the unsigned-build fallback.
    secrets:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
      FILE_PROVIDER_PROVISIONING_PROFILE: ${{ secrets.FILE_PROVIDER_PROVISIONING_PROFILE }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish:
    name: Publish prerelease
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: overlook-*
          path: dist
          merge-multiple: true

      - name: Zip the design package
        run: (cd design && zip -qr ../dist/overlook-design-package.zip handoff)

      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "$" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "_No CHANGELOG section found for $version._" > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # Mirror package.yml's platform gates so each clickable installer
          # states its own signing status. A mac cert without notarization
          # credentials cannot produce a signed release artifact; Windows uses
          # its own Azure Trusted Signing service principal (#128, #683, #735).
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' }}
          WINDOWS_SIGNED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          title="Overlook $TAG"
          asset_specs=()
          while IFS= read -r -d '' asset; do
            name="${asset##*/}"
            case "$name" in
              *.dmg|*-mac.zip)
                if [ "$MAC_SIGNED" = "true" ]; then status=signed; else status=unsigned; fi
                asset_specs+=("$asset#$name ($status)")
                ;;
              *.exe)
                if [ "$WINDOWS_SIGNED" = "true" ]; then status=signed; else status=unsigned; fi
                asset_specs+=("$asset#$name ($status)")
                ;;
              *) asset_specs+=("$asset") ;;
            esac
          done < <(find dist -type f -print0 | sort -z)
          if [ "${#asset_specs[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-runs correct historical prerelease/title metadata and replace
            # installer labels if signing availability changed.
            echo "Release $TAG exists — updating metadata and replacing assets."
            gh release edit "$TAG" --prerelease --title "$title" \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "${asset_specs[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${asset_specs[@]}" \
              --prerelease \
              --title "$title" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
