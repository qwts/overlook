name: Perf harness

# The M11 perf lane (#123): manual only — the 200K harness takes minutes
# and measures timings, so it never gates PRs. Budgets are ratchets
# (tests/perf/budgets.ts; wiki Testing-Strategy §Perf budgets). CI numbers
# are indicative — the recorded baselines come from the dev machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@68b920af61725d3107e9a7d4c151f7c06616bda4
        with:
          authorization-only: 'true'

  perf:
    needs: policy
    name: 200K perf harness
    runs-on: ubuntu-latest
    # The only bound on this job. This job runs test:perf:inner directly, without the
    # guard's --timeout-s 2700; 60 leaves headroom over the test step's 45 for
    # setup/Electron-install/upload.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes xvfb

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      # Step-level bound, replacing the guard's --timeout-s 2700 (the :inner entrypoint
      # runs unwrapped here). Below the job's 60 so a hang fails here and the report
      # upload below still runs.
      - name: Run the perf harness (Electron under Xvfb)
        timeout-minutes: 45
        run: xvfb-run --auto-servernum -- npm run test:perf:inner

      # No guard diagnostics step here: this job invokes the :inner entrypoint, so the
      # guard never runs and never writes .guard/last-run.json on a runner. The perf
      # lane's local cost is still unmeasured (docs/agent-process-guard.md); measuring it
      # needs an owner-granted local run, not this job.

      - name: Upload perf report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report
          path: test-results/perf-report.json
          retention-days: 90
