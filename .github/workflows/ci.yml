name: CI
run-name: CI ${{ github.event_name }} purpose=${{ inputs.purpose || 'automatic' }} retries=${{ inputs.e2e_retries || '0' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun
      e2e_workers:
        description: Electron E2E workers (capacity measurement; default 1)
        required: false
        type: choice
        options: ['1', '2', '3']
        default: '1'
      e2e_retries:
        description: Electron E2E retries (default 0; increase only for diagnosis)
        required: false
        type: choice
        options: ['0', '1', '2']
        default: '0'
      capacity_label:
        description: Label stored with runner-capacity evidence
        required: false
        type: string
        default: default

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  # Draft PRs run only this low-cost, read-only gate. Every PR must contribute
  # its own semantic release entry; pending changesets already on main cannot
  # satisfy a new PR's requirement.
  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install changeset dependencies
        run: npm ci --ignore-scripts

      - name: Check changeset syntax
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          npm run check:changesets

      - name: Require a PR-owned semantic changeset
        if: github.event.pull_request.head.ref != 'changeset-release/main'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:pr-changeset

  # GitHub rulesets can require a successful status before merge, but cannot
  # precondition the UI's draft-to-ready transition. Restore draft state when
  # an internal PR attempts promotion without its own semantic changeset.
  changeset-draft-guard:
    name: Changeset draft guard
    needs: changesets
    if: >-
      always() && github.event_name == 'pull_request' &&
      (github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && github.event.pull_request.draft == false)) &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref != 'changeset-release/main' &&
      needs.changesets.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Return the PR to draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/convert-to-draft" --silent

  policy:
    name: Action Policy
    needs: changesets
    if: >-
      always() && (github.event_name != 'pull_request' || needs.changesets.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      - id: policy
        uses: qwts/playbook-engineering/.github/actions/ci-policy@060af0b6a71ed32c04bb04efd07f2c87b46eec03

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful merge-group CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .display_title == "CI workflow_dispatch purpose=exact-sha-preflight retries=0" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  ci:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    # This is a whole-job limit, not the sum of the guard's own budgets: the Test step
    # (test:cov, --timeout-s 900) and the Storybook step (test:stories:ci, --timeout-s 1800)
    # alone total 45 min of guard-permitted runtime, before counting checkout/npm ci/lint/
    # format/build/Playwright-install. Sized with headroom above that 45 min guard sum so
    # GitHub doesn't cancel the job outright before a guard step records .guard/last-run.json
    # (same reasoning as the E2E job's timeout-minutes below).
    timeout-minutes: 65
    env:
      INTEROP_IMAGE_TRAIL_ROOT: ${{ github.workspace }}/node_modules/.interop-image-trail

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so lint:new-files can compute a merge-base with origin/main;
          # the default single-commit fetch made that gate silently skip in PR runs.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth: CI and local resolve Node from the same .nvmrc, so versions
          # never drift. `npm run ci` mirrors this job's gates (lint, format:check, test:cov,
          # build); bump .nvmrc to move local and CI together.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the companion checkout under the already-ignored dependency tree:
      # repo-wide Photos lint and package-pin scans must not treat Image Trail as
      # local source, while the acceptance gate still reads its pinned evidence.
      - name: Checkout pinned Image Trail acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/image-trail
          ref: cf3fe884c7729db73cfe0ddb7c90be6c4d881c09
          path: node_modules/.interop-image-trail
          persist-credentials: false

      - name: Interop acceptance
        run: npm run check:interop-acceptance

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Changesets
        # `changeset status` resolves the configured base branch by its local
        # name. A PR checkout has origin/main but does not create local main.
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Check changesets
        run: npm run check:changesets

      # Acceptance-coverage gates (#82): the map validator (every spec mapped,
      # every path exists) + the diff gate (renderer changes must account for
      # their acceptance impact; PR body/labels are read live via gh when
      # available and fall back to the signed event snapshot during API outages).
      - name: Acceptance coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:acceptance-coverage

      # The static half of the a11y gate (#398): shape, path existence, and owned debt.
      # The counts themselves are enforced at runtime by the Storybook and E2E axe lanes
      # below — those need a browser, this does not, so it fails fast and cheap.
      - name: A11y violation budget
        run: npm run check:a11y-budget

      # NODE_OPTIONS adds a second node:test reporter that turns failures into GitHub annotations
      # (file/line-anchored ::error in the run summary) — without it a red test step shows only a
      # blank "Error:" in the UI. CI-only by construction: the flags live here, not in package.json,
      # so local runs keep the plain spec output. Non-test node processes under the same step (tsc,
      # c8, npm itself) accept and ignore the flags.
      - name: Test
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=node-test-github-reporter --test-reporter-destination=stdout
        run: npm run test:cov

      # Peak-RSS/duration record from the process-tree guard (scripts/run-guarded.mjs) for the
      # test:cov run above — the data source for ratcheting the guard ceilings. Runs even on
      # failure: an rss-limit/timeout kill is exactly when the record matters.
      - name: Guard diagnostics
        if: ${{ !cancelled() }}
        run: cat .guard/last-run.json || true

      # Render c8 totals vs. the floor into the run summary. Runs even when test:cov failed
      # (dropped below the floor) — that is when the numbers matter most.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: npm run coverage:summary

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Build
        run: npm run build

      # Storybook interaction tests (#56): static build served over http,
      # test-runner drives it with Playwright chromium. Kept in this job (not
      # the Electron E2E job) — it needs a browser, not a display server.
      #
      # The whole job is lifecycle-gated, so Storybook runs only as part of a
      # complete suite; draft events start no jobs.
      - name: Install Playwright browsers (interaction tests)
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: npm run test:stories:ci

      # See the guard diagnostics note on the Test step above — same record, for the
      # Storybook lane's guard.
      - name: Guard diagnostics (Storybook)
        if: ${{ !cancelled() }}
        run: cat .guard/last-run.json || true

  # E2E is its own complete-suite job so it runs in parallel with the
  # lint/unit/build lane. test:e2e builds once via Playwright global setup.
  e2e:
    name: E2E
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    # This is a whole-job limit, not the guard's own budget: npm run test:e2e runs under
    # scripts/run-guarded.mjs with --timeout-s 1800 (30 min). Checkout/npm ci/Electron system
    # deps run before that step and the report upload runs after it, so the job timeout must
    # exceed the guard timeout with headroom — otherwise GitHub can cancel the job outright
    # before the guard records .guard/last-run.json or the report uploads (as perf.yml already
    # does for its own guarded step).
    timeout-minutes: 45
    env:
      OVERLOOK_E2E_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_workers || '1' }}
      OVERLOOK_E2E_RETRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_retries || '0' }}
      OVERLOOK_CAPACITY_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.capacity_label || 'default' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lane drives the real Electron app (no downloaded browser): Electron
      # brings its own Chromium but needs the OS libraries and a display server.
      # install-deps covers the shared libraries; xvfb provides the display.
      - name: Install Electron system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes xvfb

      # Materialize the Electron binary BEFORE tests: parallel workers racing
      # the lazy first-run download exec a half-written binary (ETXTBSY).
      # Idempotent when the postinstall already fetched it.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Playwright E2E tests (Electron under Xvfb)
        run: |
          set +e
          xvfb-run --auto-servernum -- node scripts/measure-runner-capacity.mjs -- npm run test:e2e 2>&1 | tee test-results/e2e-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 60 test-results/e2e-output.log | head -c 6000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error file=tests/e2e/offload-ui.spec.ts,line=23,title=E2E failure::$detail"
          fi
          exit "$status"

      # See the CI job's "Guard diagnostics" step — same record, for the e2e ceiling.
      - name: Guard diagnostics
        if: ${{ !cancelled() }}
        run: cat .guard/last-run.json || true

      - name: Runner capacity summary
        if: ${{ !cancelled() }}
        run: cat test-results/runner-capacity.json || true

      - name: Upload runner capacity evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-capacity-${{ github.run_attempt }}-${{ env.OVERLOOK_E2E_WORKERS }}w
          path: test-results/runner-capacity.json
          retention-days: 30

      # The HTML report is a self-contained clickable app (per-test steps, and screenshots /
      # videos / time-travel traces on failure). Upload it even when the E2E step fails —
      # that is exactly when it matters. View: download, unzip, `npx playwright show-report <dir>`.
      # This artifact is the only report channel: the job that mirrored it to GitHub Pages was
      # removed rather than create a GitHub-owned publishing exception or hand a repo-scoped
      # PAT to a third-party publishing action.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Stable required E2E verdict. Exact-SHA manual evidence supplies this context
  # when the ready run reuses its complete suite.
  e2e-gate:
    name: E2E gate
    needs: [policy, merge-evidence, preflight-evidence, e2e]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify E2E result
        run: |
          e2e='${{ needs.e2e.result }}'
          echo "E2E job: $e2e"
          test "$e2e" = success

  # Documentation governance (ENG-0009): the shared, zero-dependency docs-gov gate,
  # consumed from qwts/playbook-engineering per ENG-0004's reusable-workflow model so a
  # governance fix propagates to every repo without per-repo edits. photos' own rules —
  # include globs, indexes, token budgets, ADR Status field, stale-path scope — live in
  # docs-gov.config.json at the repo root (the workflow's default config path). A
  # deterministic gate like lint/format, so every complete suite includes it.
  docs-gov:
    name: Docs governance
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    uses: qwts/playbook-engineering/.github/workflows/docs-governance.yml@0ab1396c527536627981b27473d38d5bbdef3138 # v1

  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ubuntu-latest
    env:
      INTEROP_IMAGE_TRAIL_ROOT: ${{ github.workspace }}/.interop-image-trail
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Checkout pinned Image Trail acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/image-trail
          ref: cf3fe884c7729db73cfe0ddb7c90be6c4d881c09
          path: .interop-image-trail
          persist-credentials: false
      - name: Interop integration smoke
        run: npm run check:interop-acceptance

  gate:
    name: CI
    needs: [changesets, policy, merge-evidence, preflight-evidence, ci, e2e-gate, docs-gov, codeql, post-merge]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && needs.changesets.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.ci.result }}
          E2E_GATE: ${{ needs.e2e-gate.result }}
          DOCS_GOV: ${{ needs.docs-gov.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$POLICY" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$E2E_GATE" = success
                test "$DOCS_GOV" = success
                test "$CODEQL" = success
              fi
              ;;
            queue|manual)
              test "$COMPLETE" = success
              test "$E2E_GATE" = success
              test "$DOCS_GOV" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$COMPLETE" = success
                test "$E2E_GATE" = success
                test "$DOCS_GOV" = success
              fi
              ;;
            *) exit 1 ;;
          esac
