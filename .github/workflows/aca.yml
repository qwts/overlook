# Advisory semantic checks (agentic-code-analysis, issue qwts/agentic-code-analysis#6;
# mirrors qwts/image-trail#841). Advisory only — findings are informational;
# promotion to --enforce is a separate owner decision.
#
# Judge routing policy (owner, 2026-08-18): CI screening spends the Qwen
# token plan (prepaid credits, service pauses at quota — never surprise
# billing). Anthropic is reserved for qualification/adjudication via
# agentic-code-analysis's dispatch-only calibrate workflow; the HF router
# stays the experimentation lane. A depleted plan surfaces as
# judge-unavailable, never as findings.
#
# Per-check model assignment comes from the 2026-08-18 qualification bake-off
# (calibrate runs 32193373281, 32194066092, 32194309317, 32194311744): a
# qualification is a tuple — check + prompt version + fixture suite +
# provider + model — and no single on-plan model qualified for the whole
# suite. Each check below runs on a route that passed its graded exam at the
# required level; the receipts are on the fleet dashboard's qualifications
# page. agent-context-cost and skill-information-architecture have no
# qualified on-plan route and are deliberately absent (tracked in
# qwts/agentic-code-analysis#80). Re-shop before changing a model here: a
# route swap without a passing exam publishes verdicts nothing vouches for.
#
# The checks fan out as a matrix, one runner each: a sequential loop measured
# over an hour of wall-clock on a real PR (each judged file is a reasoning
# call), which is useless as review-time feedback. Parallel jobs cost only
# runner minutes (free on a public repo) — the judge spend is identical, and
# the per-PR concurrency group still cancels the whole set when a newer push
# obsoletes the judgment.
name: aca
on:
  pull_request:
    # Deliberately NO `synchronize`: a full-suite judgment on a real PR costs
    # millions of reasoning tokens (measured 2026-08-19: one sequential run
    # consumed a large fraction of the weekly token-plan quota), and judging
    # every push multiplies that by push count and by the auto-updater's
    # merge cadence. A PR is judged when it becomes reviewable — opened
    # non-draft, reopened, or flipped ready — and again on demand by applying
    # the `aca` label (remove and re-apply to repeat). The label, not the
    # re-run button, is the fresh-head path: a re-run replays the workflow at
    # the run's original head sha, so a revised PR would never get its new
    # delta judged that way. `ready_for_review` is listed explicitly because
    # the defaults omit it.
    types: [opened, reopened, ready_for_review, labeled]
permissions:
  contents: read
# One advisory run per PR; a newer push obsoletes the in-flight judgment.
concurrency:
  group: aca-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Repo boundary: every direct non-CI trigger runs the immutable policy
  # action in authorization-only mode before any repository work — actor and
  # fork policy are enforced before checkout, and before the judge secret is
  # exposed to a step.
  policy:
    name: Action Policy
    # Draft guard (ci.yml's); a `labeled` event judges only when the label is
    # `aca` (any other label application is noise, not intent); and a diff
    # budget: a PR past 25 changed files is not judged at all — per-file
    # reasoning calls across ten checks on a sweeping refactor is the exact
    # multi-million-token burn measured on 2026-08-19, and "this PR is too
    # large to judge economically" is itself the first review finding. The
    # skip is loud (see the over-budget job), never a silent partial:
    # judging a truncated subset would present a partial verdict as a whole
    # one. `changed_files` comes free with the event — no checkout spent
    # deciding.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.action != 'labeled' || github.event.label.name == 'aca')
      && github.event.pull_request.changed_files <= 25
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          authorization-only: 'true'
  over-budget:
    name: aca skipped — diff exceeds judgment budget
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.action != 'labeled' || github.event.label.name == 'aca')
      && github.event.pull_request.changed_files > 25
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          {
            echo "## aca: not judged"
            echo ""
            echo "This PR changes ${CHANGED} files — past the 25-file judgment budget."
            echo "Per-file reasoning across ten checks on a diff this size costs a"
            echo "meaningful fraction of the weekly judge quota, and the size itself"
            echo "is the first review finding. Split the PR, or accept that this"
            echo "change ships without semantic advisory coverage."
          } >> "$GITHUB_STEP_SUMMARY"
  check:
    name: aca ${{ matrix.check }}
    needs: policy
    # Same guards as policy: needs alone would also skip when policy skips,
    # but stating them keeps the conditions readable where the matrix lives.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.action != 'labeled' || github.event.label.name == 'aca')
      && github.event.pull_request.changed_files <= 25
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Advisory: every check reports; one check's findings must not silence
      # another's runner.
      fail-fast: false
      matrix:
        include:
          - { check: context-footprint, model: qwen3.7-max }
          - { check: failure-posture, model: qwen3.7-max }
          - { check: seam-audit, model: qwen3.7-max }
          - { check: review-readiness, model: qwen3.7-max }
          - { check: test-honesty, model: qwen3.7-max }
          - { check: naming-truth, model: qwen3.7-max }
          - { check: commit-coherence, model: qwen3.8-max }
          - { check: doc-drift, model: qwen3.8-max }
          - { check: agent-rule-conflict, model: deepseek-v4-pro }
          - { check: single-responsibility, model: deepseek-v4-pro }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base with origin/main needs history
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agentic-code-analysis
          ref: 60be121a7b27c94c56f85ac61c20ea61ab1d5d0f # main 2026-08-18 (first pin with the qwen adapter); bump deliberately
          path: .aca
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install advisory checker dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@b146b85da189d188f71cda59d363eec7272e498e
        with:
          task: Install advisory checker dependencies
          executable: npm
          arguments-json: '["clean-install"]'
          working-directory: .aca
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      # A pull request can commit a file under .cache/aca whose name matches a
      # real content-addressed verdict. Remove caller-controlled entries before
      # restoring the trusted Actions cache so they cannot suppress a judge
      # call (same guard as playbook-engineering's semantic-ratchet).
      - name: Discard checked-out semantic verdicts
        run: rm -rf -- .cache/aca
      # Per-check cache keys: matrix jobs saving one shared key would race,
      # and the first saver would evict every other check's verdicts.
      - name: Restore semantic verdicts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/aca
          key: aca-${{ matrix.check }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            aca-${{ matrix.check }}-${{ runner.os }}-
      # Exit 78 is the suite saying "nothing in this diff for me" and is not
      # a failure; findings or a judge error turn this check's advisory job
      # red without touching its siblings.
      - name: Run ${{ matrix.check }}
        env:
          ACA_PROVIDER: qwen
          ACA_MODEL: ${{ matrix.model }}
          QWEN_BASE_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          CHECK: ${{ matrix.check }}
        run: |
          rc=0
          node .aca/src/cli.ts "$CHECK" --base origin/main || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 78 ]; then
            exit "$rc"
          fi
